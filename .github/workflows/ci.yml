name: Go and EPICS IOC validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_pr_status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run-ci: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/github-script@v8
        id: check
        with:
          script: |
            // Main pushes must always run: successful push CI gates releases.
            if (context.eventName !== 'push' || context.ref === 'refs/heads/main' ||
                !context.ref.startsWith('refs/heads/')) return true;
            const branch = context.ref.slice('refs/heads/'.length);
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
              per_page: 1
            });
            if (prs.data.length) {
              core.notice(`Skipping duplicate push CI; PR #${prs.data[0].number} runs CI.`);
              return false;
            }
            return true;

  unit:
    needs: check_pr_status
    if: needs.check_pr_status.outputs.run-ci == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Race, shuffled unit tests and coverage
        run: go test -race -shuffle=on -covermode=atomic -coverprofile="$RUNNER_TEMP/coverage.out" ./...
      - name: Require more than 90 percent in every package
        run: ./scripts/check-coverage.sh "$RUNNER_TEMP/coverage.out" 90
      - name: Vet
        run: go vet ./...
      - name: Build without cgo
        env:
          CGO_ENABLED: '0'
        run: go build ./...

  ioc:
    needs: check_pr_status
    if: needs.check_pr_status.outputs.run-ci == 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install EPICS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl libreadline-dev
      - name: Cache pinned EPICS Base build
        id: epics
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/epics-base
          key: epics-base-7.0.8.1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-v1
      - name: Build EPICS Base 7.0.8.1
        if: steps.epics.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://epics.anl.gov/download/base/base-7.0.8.1.tar.gz -o "$RUNNER_TEMP/epics-base.tar.gz"
          echo "6c93a5e09b21392adbb3de423605d428ee4ddb1272fc708a251b082272fa73f5  $RUNNER_TEMP/epics-base.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/epics-base"
          tar -xzf "$RUNNER_TEMP/epics-base.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/epics-base"
          make -C "$RUNNER_TEMP/epics-base" -j2
      - name: Locate IOC
        shell: bash
        run: |
          epics_arch=$("$RUNNER_TEMP/epics-base/startup/EpicsHostArch")
          test -x "$RUNNER_TEMP/epics-base/bin/$epics_arch/softIoc"
          echo "$RUNNER_TEMP/epics-base/bin/$epics_arch" >> "$GITHUB_PATH"
      - name: Race and shuffled real IOC tests
        env:
          CAGO_REQUIRE_IOC: '1'
        run: go test -race -tags=e2e -shuffle=on -count=2 -timeout=5m -v ./test/e2e

  fuzz:
    needs: check_pr_status
    if: needs.check_pr_status.outputs.run-ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/wire
            target: FuzzFrame
          - package: ./internal/ca
            target: FuzzDecodeValue
          - package: ./internal/ca
            target: FuzzNumericRoundTrip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '5m' || '30s' }}
        run: go test "$FUZZ_PACKAGE" -run='^$' -fuzz="^${FUZZ_TARGET}$" -fuzztime="$FUZZ_TIME" -parallel=2 -timeout=8m
      - name: Preserve failing inputs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: internal/**/testdata/fuzz/**
          if-no-files-found: ignore

  vulnerability:
    needs: check_pr_status
    if: needs.check_pr_status.outputs.run-ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check for reachable vulnerabilities
        run: govulncheck ./...
