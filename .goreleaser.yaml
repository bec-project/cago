version: 2
project_name: cago

builds:
  - id: cago
    main: ./cmd/cago
    binary: cago
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: cago-rpm
    ids: [cago]
    package_name: cago
    file_name_template: '{{ .ConventionalFileName }}'
    homepage: https://github.com/bec-project/cago
    maintainer: BEC Project
    description: EPICS Channel Access command-line tools written in Go.
    license: MIT
    formats: [rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/cago/LICENSE
      - src: README.md
        dst: /usr/share/doc/cago/README.md

checksum:
  name_template: checksums.txt

# semantic-release supplies the version and publishes the generated assets.
# Build before creating the tag, so a build failure cannot leave a release tag.
snapshot:
  version_template: '{{ .Env.RELEASE_VERSION }}'

changelog:
  disable: true
